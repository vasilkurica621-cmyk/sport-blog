<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportZone — Blog o sportu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">SPORT<span>ZONE</span></a>
      <nav class="nav" id="nav">
        <a href="index.html"            class="nav__link active" data-i18n="nav_home"></a>
        <a href="#categories"           class="nav__link"        data-i18n="nav_categories"></a>
        <a href="articles.html"         class="nav__link"        data-i18n="nav_articles"></a>
        <a href="#about"                class="nav__link"        data-i18n="nav_about"></a>
      </nav>
      <button class="burger" id="burger" aria-label="Nabídka">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero__overlay"></div>
    <div class="container hero__content">
      <span class="hero__tag" data-i18n="hero_tag"></span>
      <h1 class="hero__title">Jak správně<br>začít cvičit<br>od nuly</h1>
      <p class="hero__desc" data-i18n="hero_desc"></p>
      <a href="article.html" class="btn btn--primary" data-i18n="hero_btn"></a>
    </div>
  </section>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="container stats-bar__inner">
      <div class="stat"><strong>128</strong><span data-i18n="stat_articles"></span></div>
      <div class="stat"><strong>14</strong><span data-i18n="stat_categories"></span></div>
      <div class="stat"><strong>50K+</strong><span data-i18n="stat_readers"></span></div>
      <div class="stat"><strong data-i18n="stat_years"></strong><span data-i18n="stat_experience"></span></div>
    </div>
  </div>

  <!-- CATEGORIES -->
  <section class="categories section" id="categories">
    <div class="container">
      <h2 class="section__title" data-i18n="section_categories"></h2>
      <div class="categories__grid">
        <a href="articles.html?cat=football" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_football"></span>
          <span class="category-card__count" data-i18n="cat_count_football"></span>
        </a>
        <a href="articles.html?cat=fitness" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_fitness"></span>
          <span class="category-card__count" data-i18n="cat_count_fitness"></span>
        </a>
        <a href="articles.html?cat=nutrition" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_nutrition"></span>
          <span class="category-card__count" data-i18n="cat_count_nutrition"></span>
        </a>
        <a href="articles.html?cat=mma" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_mma"></span>
          <span class="category-card__count" data-i18n="cat_count_mma"></span>
        </a>
        <a href="articles.html?cat=running" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1571008887538-b36bb32f4571?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_running"></span>
          <span class="category-card__count" data-i18n="cat_count_running"></span>
        </a>
        <a href="articles.html?cat=basketball" class="category-card" style="--bg: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?w=600&q=80')">
          <div class="category-card__overlay"></div>
          <span class="category-card__name" data-i18n="cat_basketball"></span>
          <span class="category-card__count" data-i18n="cat_count_basketball"></span>
        </a>
      </div>
    </div>
  </section>

  <!-- LATEST ARTICLES -->
  <section class="articles section">
    <div class="container">
      <div class="section__header">
        <h2 class="section__title" data-i18n="section_latest"></h2>
        <a href="articles.html" class="btn btn--outline" data-i18n="btn_all_articles"></a>
      </div>
      <div class="articles__grid" id="articles-grid"></div>
    </div>
  </section>

  <!-- QUOTE BANNER -->
  <section class="quote-banner">
    <div class="container">
      <blockquote class="quote" data-i18n="quote_text"></blockquote>
      <cite>— Arnold Schwarzenegger</cite>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about section" id="about">
    <div class="container about__inner">
      <div class="about__image">
        <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=600&q=80" alt="About">
      </div>
      <div class="about__text">
        <h2 class="section__title" data-i18n="about_title"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
        <a href="articles.html" class="btn btn--primary" data-i18n="about_btn"></a>
      </div>
    </div>
  </section>

  <!-- NEWSLETTER -->
  <section class="newsletter">
    <div class="container newsletter__inner">
      <h2 data-i18n="newsletter_title"></h2>
      <p data-i18n="newsletter_desc"></p>
      <form class="newsletter__form" onsubmit="handleSubscribe(event)">
        <input type="email" data-i18n-ph="newsletter_ph" required>
        <button type="submit" class="btn btn--primary" data-i18n="newsletter_btn"></button>
      </form>
      <p class="newsletter__thanks" id="thanks-msg" style="display:none;" data-i18n="newsletter_thanks"></p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer__inner">
      <a href="index.html" class="logo">SPORT<span>ZONE</span></a>
      <p class="footer__copy">&copy; 2026 SportZone. <span data-i18n="footer_copy"></span></p>
      <div class="footer__links">
        <a href="#">Instagram</a>
        <a href="#">YouTube</a>
        <a href="#">Telegram</a>
      </div>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
